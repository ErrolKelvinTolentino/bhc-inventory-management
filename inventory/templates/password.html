<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>Change password · Inventory</title><link rel="stylesheet" href="/static/app.css"><link rel="icon" href="/static/favicon.svg"><script src="/static/password.js" defer></script></head><body class="auth-body"><header class="auth-top"><a href="/" class="wordmark"><span class="brand-mark"><span></span></span><span>Inventory</span></a>{% if not recovery %}<a href="/" class="text-link">Back to workspace</a>{% endif %}</header><main class="password-page"><section class="auth-form-wrap"><span class="auth-step">YOUR ACCOUNT</span><h2>{{ 'A fresh password.' if recovery else 'Change your password.' }}</h2><p class="auth-description">Use at least eight characters. Choose a password you don't use elsewhere.</p><form id="password-form">{% if not recovery %}<label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>{% endif %}<label>New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirmation" required minlength="8" autocomplete="new-password"></label><p class="form-error" id="password-error" role="alert" hidden></p><button class="button primary auth-submit" type="submit">Save new password</button></form></section></main></body></html>
